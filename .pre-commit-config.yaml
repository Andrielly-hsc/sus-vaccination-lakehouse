# Hooks run on `git commit`. Install once with: pre-commit install
# (done automatically by scripts/post_create.sh in the codespace).
# Run on everything with: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # Data never belongs in git; this also catches accidental Parquet/Delta/CSV commits.
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6  # keep in sync with ruff in requirements-lock.txt
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
