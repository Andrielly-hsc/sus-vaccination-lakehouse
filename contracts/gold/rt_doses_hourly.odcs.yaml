  - name: municipality_code_6
    logicalType: string
    physicalType: string
    required: true
    classification: aggregate
    description: Facility municipality.
    primaryKey: true
    primaryKeyPosition: 2
  - name: vaccine_code
    logicalType: string
    physicalType: string
    required: true
    classification: aggregate
    description: Vaccine.
    primaryKey: true
    primaryKeyPosition: 3
  - name: window_end
    logicalType: timestamp
    physicalType: timestamp
    required: true
    classification: aggregate
    description: Window end.
  - name: doses
    logicalType: integer
    physicalType: bigint
    required: true
    classification: aggregate
    description: Doses received so far for the window.
  - name: is_provisional
    logicalType: boolean
    physicalType: boolean
