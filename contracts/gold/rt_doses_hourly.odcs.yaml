schema:
- name: rt_doses_hourly
  physicalName: gold.rt_doses_hourly
  physicalType: table
  description: Windowed streaming aggregate (1-hour tumbling windows, watermark).
  dataGranularityDescription: 1-hour window x municipality x vaccine.
  properties:
  - name: window_start
    logicalType: timestamp
    physicalType: timestamp
    required: true
