    description: Column dose_code of the seed file.
  - name: dose_name
    logicalType: string
    physicalType: string
    required: true
    classification: operational
    description: Column dose_name of the seed file.
  - name: dose_kind
    logicalType: string
    physicalType: string
    required: true
    classification: operational
    description: Column dose_kind of the seed file.
  - name: dose_number
    logicalType: string
    physicalType: string
    required: true
    classification: operational
    description: Column dose_number of the seed file.
  - name: _git_commit
    logicalType: string
    physicalType: string
    required: true
    classification: technical
    description: Commit of the seed file loaded.
  - *id001
  - *id002
team:
  name: vaxlake
  description: Portfolio project team (single maintainer).
  members:
  - username: Andrielly-hsc
    role: Data product owner and data engineer
