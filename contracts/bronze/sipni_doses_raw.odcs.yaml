  - name: _corrupt_record
    logicalType: string
    physicalType: string
    required: false
    classification: technical
    description: Raw line when Spark could not parse it (PERMISSIVE mode); null otherwise.
  - name: _source_file
    logicalType: string
    physicalType: string
    required: true
    classification: technical
    description: Landing file the row came from (Spark _metadata.file_path).
  - name: _file_hash
    logicalType: string
    physicalType: string
    required: true
    classification: technical
    description: SHA-256 of the landing file; identifies the published version of a month.
  - name: _batch_id
    logicalType: string
    physicalType: string
    required: true
    classification: technical
    description: Identifier of the ingestion run (run_id).
  - name: _ingested_at
    logicalType: timestamp
    physicalType: timestamp
    required: true
    classification: technical
    description: When the row was written to bronze (UTC).
  - name: _ingest_date
    logicalType: date
    physicalType: date
    required: true
    classification: technical
    description: Ingestion date; partition column.
    partitioned: true
    partitionKeyPosition: 1
  quality:
  - name: reconciles_with_manifest
    type: sql
    dimension: completeness
    severity: error
    description: Rows per file equal the row count recorded in the landing manifest.
    query: SELECT COUNT(*) FROM ${object} b JOIN ops.landing_manifest m ON b._file_hash = m.sha256 GROUP
      BY b._file_hash, m.rows HAVING COUNT(*) <> m.rows
    mustBe: 0
  - name: corrupt_rows_rare
    type: library
    metric: nullValues
    arguments:
      properties:
      - _corrupt_record
    description: Share of unparseable rows stays below 0.1 % (they are kept, not dropped).
    mustBeGreaterOrEqualTo: 99.9
    unit: percent
    dimension: conformity
    severity: warning
slaProperties:
- property: frequency
