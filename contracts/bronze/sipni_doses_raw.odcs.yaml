# Generated once from the data dictionary (docs/data/data_dictionary.md); edit by hand from now on.
apiVersion: v3.2.0
kind: DataContract
id: vaxlake-bronze-sipni-doses-raw
name: Bronze SI-PNI doses (raw)
version: 0.1.0
status: proposed
domain: public-health-immunisation
dataProduct: sus-vaccination-lakehouse
description:
  purpose: Faithful, append-only copy of every landing file of the SI-PNI source, as text, with provenance
    columns, so that silver can always be rebuilt and any number traced to its file.
  usage: Read only by the silver jobs. Not for analysis.
  limitations: 'All columns are strings; no deduplication, no validation beyond the file contract. Contains
    pseudonymous and sensitive columns: never exposed outside the lakehouse.'
servers:
- server: lakehouse-local
  type: local
  path: data/lakehouse/bronze/sipni_doses_raw
  format: delta
  environment: dev
schema:
- name: sipni_doses_raw
  physicalName: bronze.sipni_doses_raw
  physicalType: table
  description: Source columns unchanged (names and text values) plus ingestion metadata (columns starting
    with '_').
  dataGranularityDescription: One row per source row per landing file version; the same dose appears again
    when a month is re-published.
  properties:
  - name: co_documento
    logicalType: string
    physicalType: string
    required: true
    classification: id
    description: Identifier (UUID) of the FHIR document in the RNDS; one per dose record.
    criticalDataElement: true
    transformSourceObjects:
    - source.sipni_doses.co_documento
    transformLogic: copied as text, unchanged
  - name: co_paciente
    logicalType: string
    physicalType: string
    required: true
    classification: pseudonym
    description: Pseudonymous patient identifier assigned by the RNDS (hash).
    transformSourceObjects:
    - source.sipni_doses.co_paciente
    transformLogic: copied as text, unchanged
  - name: tp_sexo_paciente
    logicalType: string
    physicalType: string
    required: true
    classification: quasi
    description: 'Biological sex: F, M or I (indeterminate).'
