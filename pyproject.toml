# Project metadata and tool configuration (PEP 621).
# Ranges here declare compatibility; exact versions live in requirements-lock.txt.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vaccination-lakehouse"
version = "0.1.0"
description = "Real-time lakehouse on public SUS vaccination data (SI-PNI): PySpark + Delta Lake, bronze/silver/gold, data contracts and quality gates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrielly-hsc" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    # Spark and Delta must be a compatible pair (ADR-0009):
    # delta-spark 4.4 supports Spark 4.1 and 4.2; Great Expectations' Spark support requires < 4.2.
    "pyspark>=4.1,<4.2",
    "delta-spark>=4.4,<4.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23",  # validates contracts/ against the ODCS JSON Schema
    "pip-tools>=7.4",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
vaxlake = "vaccination_lakehouse.cli:app"

[project.urls]
Repository = "https://github.com/Andrielly-hsc/sus-vaccination-lakehouse"

[tool.hatch.build.targets.wheel]
packages = ["src/vaccination_lakehouse"]

# ---------------------------------------------------------------------------
# ruff: linter + formatter (replaces flake8, isort, black)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes (unused imports, undefined names)
    "I",       # isort (import order)
    "B",       # flake8-bugbear (likely bugs)
    "UP",      # pyupgrade (modern syntax)
    "SIM",     # flake8-simplify
    "N",       # pep8-naming
]
# B008: typer declares CLI options as default arguments (typer.Option(...)) by design.
# N812: the PySpark community convention is `functions as F` and `types as T`.
ignore = ["B008", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["vaccination_lakehouse"]

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--cov=vaccination_lakehouse", "--cov-report=term-missing"]
markers = [
    "spark: needs a local SparkSession and Java 17 (added automatically to tests using the `spark` fixture)",
    "integration: runs several pipeline layers end to end on fixtures",
]

[tool.coverage.run]
branch = true
source = ["vaccination_lakehouse"]

[tool.coverage.report]
show_missing = true
skip_covered = false
